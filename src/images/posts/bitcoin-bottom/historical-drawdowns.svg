<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Selected Bitcoin cycle drawdowns</title>
  <desc id="desc">Horizontal bars compare prior Bitcoin peak-to-trough drawdowns of 94, 85, 84, and 78 percent with the 49 percent 2025 to 2026 drawdown measured by VanEck on August 12, 2026.</desc>
  <rect width="1200" height="675" rx="36" fill="#111827"/>
  <text x="70" y="76" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="34" font-weight="700">A shallower drawdown is evidence—not proof</text>
  <text x="70" y="116" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="19">Selected cycle peak-to-trough declines cited by VanEck, measured August 12, 2026</text>
  <g font-family="system-ui, sans-serif" font-size="20">
    <text x="110" y="205" fill="#cbd5e1">2011</text><rect x="230" y="178" width="752" height="36" rx="8" fill="#475569"/><text x="1000" y="205" fill="#cbd5e1">−94%</text>
    <text x="110" y="285" fill="#cbd5e1">2015</text><rect x="230" y="258" width="680" height="36" rx="8" fill="#475569"/><text x="928" y="285" fill="#cbd5e1">−85%</text>
    <text x="110" y="365" fill="#cbd5e1">2018</text><rect x="230" y="338" width="672" height="36" rx="8" fill="#475569"/><text x="920" y="365" fill="#cbd5e1">−84%</text>
    <text x="110" y="445" fill="#cbd5e1">2022</text><rect x="230" y="418" width="624" height="36" rx="8" fill="#475569"/><text x="872" y="445" fill="#cbd5e1">−78%</text>
    <text x="110" y="525" fill="#fef3c7" font-weight="700">2026*</text><rect x="230" y="498" width="392" height="36" rx="8" fill="#f59e0b"/><text x="640" y="525" fill="#fbbf24" font-weight="700">−49%</text>
    <text x="230" y="590" fill="#94a3b8" font-size="17">*Current cycle snapshot, not a confirmed final trough.</text>
    <text x="230" y="620" fill="#64748b" font-size="16">Source: VanEck Mid-August 2026 Bitcoin ChainCheck; visualization by James Tsetsekas</text>
  </g>
</svg>
