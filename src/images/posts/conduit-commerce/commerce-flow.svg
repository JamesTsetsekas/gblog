<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Nostr commerce flow</title>
  <desc id="desc">A buyer and merchant use external signers, shared Nostr relays, encrypted order messages, and direct Lightning payment without a central marketplace account.</desc>
  <rect width="1200" height="675" rx="36" fill="#111827"/>
  <text x="60" y="72" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="34" font-weight="700">Commerce as signed, portable events</text>
  <g font-family="system-ui, sans-serif">
    <rect x="60" y="165" width="225" height="290" rx="24" fill="#1f2937" stroke="#22d3ee" stroke-width="3"/>
    <text x="172" y="220" fill="#cffafe" font-size="26" text-anchor="middle" font-weight="700">Buyer</text>
    <rect x="95" y="270" width="155" height="70" rx="14" fill="#0e7490"/>
    <text x="172" y="312" fill="#fff" font-size="19" text-anchor="middle">External signer</text>
    <text x="172" y="390" fill="#94a3b8" font-size="18" text-anchor="middle">discovers products</text>
    <text x="172" y="420" fill="#94a3b8" font-size="18" text-anchor="middle">authorizes order</text>
    <rect x="405" y="125" width="390" height="360" rx="28" fill="#212b3e" stroke="#a78bfa" stroke-width="3"/>
    <text x="600" y="180" fill="#ede9fe" font-size="26" text-anchor="middle" font-weight="700">Nostr relays</text>
    <circle cx="490" cy="260" r="45" fill="#6d28d9"/><circle cx="600" cy="260" r="45" fill="#7c3aed"/><circle cx="710" cy="260" r="45" fill="#8b5cf6"/>
    <path d="M490 260h220M545 260l55 110 55-110" fill="none" stroke="#c4b5fd" stroke-width="5"/>
    <text x="600" y="410" fill="#c4b5fd" font-size="18" text-anchor="middle">public product events</text>
    <text x="600" y="440" fill="#c4b5fd" font-size="18" text-anchor="middle">gift-wrapped encrypted orders</text>
    <rect x="915" y="165" width="225" height="290" rx="24" fill="#1f2937" stroke="#f59e0b" stroke-width="3"/>
    <text x="1027" y="220" fill="#fef3c7" font-size="26" text-anchor="middle" font-weight="700">Merchant</text>
    <rect x="950" y="270" width="155" height="70" rx="14" fill="#b45309"/>
    <text x="1027" y="312" fill="#fff" font-size="19" text-anchor="middle">External signer</text>
    <text x="1027" y="390" fill="#94a3b8" font-size="18" text-anchor="middle">publishes catalog</text>
    <text x="1027" y="420" fill="#94a3b8" font-size="18" text-anchor="middle">fulfills order</text>
    <path d="M285 240h120M795 240h120" stroke="#94a3b8" stroke-width="5"/>
    <path d="M385 225l20 15-20 15M815 225l-20 15 20 15" fill="none" stroke="#94a3b8" stroke-width="5"/>
    <path d="M280 525h640" stroke="#f59e0b" stroke-width="5"/><path d="M900 510l20 15-20 15" fill="none" stroke="#f59e0b" stroke-width="5"/>
    <text x="600" y="565" fill="#fbbf24" font-size="21" text-anchor="middle" font-weight="650">Lightning payment: buyer → merchant</text>
    <text x="600" y="596" fill="#94a3b8" font-size="17" text-anchor="middle">The protocol moves messages; it does not eliminate fulfillment, dispute, or trust decisions.</text>
  </g>
</svg>
