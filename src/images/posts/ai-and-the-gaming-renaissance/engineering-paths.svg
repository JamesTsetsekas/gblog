<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Different engineering paths to player control</title><desc id="d">Decompilation reconstructs source, static recompilation translates binary code, engine reimplementation reads old data in a new engine, and community clients and mods extend existing software. Real projects can combine techniques.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#efb467" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="#111e2b"/><g font-family="Segoe UI,Arial,sans-serif"><text x="50" y="62" fill="#ffffff" font-size="34" font-weight="700">DIFFERENT PATHS TO PLAYER CONTROL</text><text x="50" y="104" fill="#8eb6cc" font-size="23" font-weight="400">Reverse engineering supplies knowledge. These are different ways to use it.</text><rect x="48" y="145" width="536" height="207" rx="12" fill="#1b2d3e" stroke="#3a5265"/><text x="70" y="187" fill="#efb467" font-size="24" font-weight="700">DECOMPILATION</text><text x="70" y="233" fill="#c4d4e2" font-size="22" font-weight="400">Reconstruct source from compiled code.</text><text x="70" y="267" fill="#c4d4e2" font-size="22" font-weight="400">Adapt the program for a new platform.</text><text x="70" y="321" fill="#8bd0b5" font-size="18" font-weight="400">Example: Mario 64 PC-port lineage</text><rect x="616" y="145" width="536" height="207" rx="12" fill="#1b2d3e" stroke="#3a5265"/><text x="638" y="187" fill="#efb467" font-size="24" font-weight="700">STATIC RECOMPILATION</text><text x="638" y="233" fill="#c4d4e2" font-size="22" font-weight="400">Translate binary code ahead of time.</text><text x="638" y="267" fill="#c4d4e2" font-size="22" font-weight="400">Integrate runtime, rendering and input.</text><text x="638" y="321" fill="#8bd0b5" font-size="18" font-weight="400">Example: Zelda64Recomp</text><rect x="48" y="375" width="536" height="207" rx="12" fill="#1b2d3e" stroke="#3a5265"/><text x="70" y="417" fill="#efb467" font-size="24" font-weight="700">ENGINE REIMPLEMENTATION</text><text x="70" y="463" fill="#c4d4e2" font-size="22" font-weight="400">Write a compatible engine.</text><text x="70" y="497" fill="#c4d4e2" font-size="22" font-weight="400">Read the original game data.</text><text x="70" y="551" fill="#8bd0b5" font-size="18" font-weight="400">Example: OpenMW</text><rect x="616" y="375" width="536" height="207" rx="12" fill="#1b2d3e" stroke="#3a5265"/><text x="638" y="417" fill="#efb467" font-size="24" font-weight="700">COMMUNITY CLIENTS + MODS</text><text x="638" y="463" fill="#c4d4e2" font-size="22" font-weight="400">Extend an existing implementation.</text><text x="638" y="497" fill="#c4d4e2" font-size="22" font-weight="400">Add hosting, scripting or new behavior.</text><text x="638" y="551" fill="#8bd0b5" font-size="18" font-weight="400">Examples: IW4x and ReSkate</text><text x="50" y="640" fill="#ffffff" font-size="21" font-weight="400">Techniques can overlap. A native port is an outcome, not one universal method.</text></g></svg>