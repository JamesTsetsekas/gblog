<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">From documented knowledge to tested play</title><desc id="d">Human research and documentation support implementation. Where project policy permits, AI can help with setup and code. Builds and behavior checks feed human review and better documentation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#efb467" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="#111e2b"/><g font-family="Segoe UI,Arial,sans-serif"><text x="50" y="62" fill="#ffffff" font-size="32" font-weight="700">FROM DOCUMENTED KNOWLEDGE TO TESTED PLAY</text><text x="50" y="103" fill="#8eb6cc" font-size="22" font-weight="400">A possible workflow, with AI assistance only where project policy permits it.</text><rect x="48" y="160" width="260" height="300" rx="12" fill="#1b2d3e" stroke="#3a5265"/><text x="68" y="205" fill="#efb467" font-size="21" font-weight="700">01</text><text x="68" y="252" fill="#ffffff" font-size="25" font-weight="700">RESEARCH</text><text x="68" y="304" fill="#c4d4e2" font-size="18" font-weight="400">Formats and protocols</text><text x="68" y="341" fill="#c4d4e2" font-size="18" font-weight="400">Reference behavior</text><text x="68" y="378" fill="#c4d4e2" font-size="18" font-weight="400">Existing tools and credit</text><path d="M311 310H327" fill="none" stroke="#efb467" stroke-width="2" marker-end="url(#arrow)"/><rect x="328" y="160" width="260" height="300" rx="12" fill="#1b2d3e" stroke="#3a5265"/><text x="348" y="205" fill="#efb467" font-size="21" font-weight="700">02</text><text x="348" y="252" fill="#ffffff" font-size="25" font-weight="700">IMPLEMENT</text><text x="348" y="304" fill="#c4d4e2" font-size="18" font-weight="400">Build and configure</text><text x="348" y="341" fill="#c4d4e2" font-size="18" font-weight="400">Adapters and diagnostics</text><text x="348" y="378" fill="#c4d4e2" font-size="18" font-weight="400">Assistance where allowed</text><path d="M591 310H607" fill="none" stroke="#efb467" stroke-width="2" marker-end="url(#arrow)"/><rect x="608" y="160" width="260" height="300" rx="12" fill="#1b2d3e" stroke="#3a5265"/><text x="628" y="205" fill="#efb467" font-size="21" font-weight="700">03</text><text x="628" y="252" fill="#ffffff" font-size="25" font-weight="700">VERIFY</text><text x="628" y="304" fill="#c4d4e2" font-size="18" font-weight="400">Compile and boot</text><text x="628" y="341" fill="#c4d4e2" font-size="18" font-weight="400">Test controls and saves</text><text x="628" y="378" fill="#c4d4e2" font-size="18" font-weight="400">Compare game behavior</text><path d="M871 310H887" fill="none" stroke="#efb467" stroke-width="2" marker-end="url(#arrow)"/><rect x="888" y="160" width="260" height="300" rx="12" fill="#1b2d3e" stroke="#3a5265"/><text x="908" y="205" fill="#efb467" font-size="21" font-weight="700">04</text><text x="908" y="252" fill="#ffffff" font-size="25" font-weight="700">MAINTAIN</text><text x="908" y="304" fill="#c4d4e2" font-size="18" font-weight="400">Human review</text><text x="908" y="341" fill="#c4d4e2" font-size="18" font-weight="400">Useful bug reports</text><text x="908" y="378" fill="#c4d4e2" font-size="18" font-weight="400">Documentation and fixes</text><path d="M1018 480V529H178V480" fill="none" stroke="#efb467" stroke-width="2" marker-end="url(#arrow)"/><text x="385" y="518" fill="#efb467" font-size="22" font-weight="400">Carry knowledge forward</text><text x="50" y="612" fill="#ffffff" font-size="23" font-weight="600">A working build is a milestone. Fidelity and maintainability need further work.</text></g></svg>