<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Bitcoin security stack</title>
  <desc id="desc">Five layers from key generation through operations, with a failure at any layer able to affect funds.</desc>
  <rect width="1200" height="675" rx="36" fill="#111827"/>
  <text x="72" y="82" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="34" font-weight="700">Security is a stack, not a product</text>
  <text x="72" y="122" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20">A strong base layer cannot repair a broken boundary above it.</text>
  <g font-family="system-ui, sans-serif" font-size="23" font-weight="650">
    <rect x="100" y="165" width="1000" height="72" rx="14" fill="#263449"/><text x="135" y="210" fill="#e2e8f0">5  Operations: updates, backups, monitoring, response</text>
    <rect x="145" y="251" width="910" height="72" rx="14" fill="#20435a"/><text x="180" y="296" fill="#e2e8f0">4  Bridges and federations: issuance, custody, peg controls</text>
    <rect x="190" y="337" width="820" height="72" rx="14" fill="#15586d"/><text x="225" y="382" fill="#e2e8f0">3  Applications: validation, dependencies, build artifacts</text>
    <rect x="235" y="423" width="730" height="72" rx="14" fill="#0e7490"/><text x="270" y="468" fill="#f8fafc">2  Authorization: signers, macaroons, sessions</text>
    <rect x="280" y="509" width="640" height="72" rx="14" fill="#f59e0b"/><text x="315" y="554" fill="#111827">1  Key generation: entropy, seeds, derivation</text>
  </g>
  <path d="M1080 190v385" stroke="#fb7185" stroke-width="5" stroke-dasharray="10 12"/>
  <path d="M1060 550l20 32 20-32" fill="none" stroke="#fb7185" stroke-width="5"/>
  <text x="1120" y="390" fill="#fda4af" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle" transform="rotate(90 1120 390)">failure can cross layers</text>
  <text x="600" y="632" fill="#64748b" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle">Conceptual model by James Tsetsekas</text>
</svg>
