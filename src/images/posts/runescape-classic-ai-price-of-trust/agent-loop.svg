<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">From world state to verified outcome</title><desc id="desc">Proposed gameplay evaluation architecture. Existing scripts, status and transfer controls support a future model decision layer; the benchmark is proposed.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#e6ad61" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#101c29"/><g font-family="Segoe UI,Arial,sans-serif"><text x="52" y="64" font-size="34" font-weight="700" fill="#ffffff">FROM WORLD STATE TO VERIFIED OUTCOME</text><text x="52" y="105" font-size="22" font-weight="400" fill="#8fb3c9">Proposed gameplay evaluation loop · grounded in existing execution tooling</text><rect x="48" y="160" width="260" height="300" rx="12" fill="#1a2c3d" stroke="#385064"/><text x="68" y="200" font-size="21" font-weight="700" fill="#e6ad61">01</text><text x="68" y="247" font-size="27" font-weight="700" fill="#ffffff">OBSERVE</text><text x="68" y="292" font-size="19" font-weight="400" fill="#b9cbd9">Inventory and location</text><text x="68" y="325" font-size="19" font-weight="400" fill="#b9cbd9">Worker and trade state</text><text x="68" y="358" font-size="19" font-weight="400" fill="#b9cbd9">Freshness and unknowns</text><text x="68" y="426" font-size="17" font-weight="400" fill="#87d2bc">Existing foundation</text><path d="M311 310H326" fill="none" stroke="#e6ad61" stroke-width="2" marker-end="url(#arrow)"/><rect x="328" y="160" width="260" height="300" rx="12" fill="#1a2c3d" stroke="#385064"/><text x="348" y="200" font-size="21" font-weight="700" fill="#e6ad61">02</text><text x="348" y="247" font-size="27" font-weight="700" fill="#ffffff">DECIDE</text><text x="348" y="292" font-size="19" font-weight="400" fill="#b9cbd9">Choose a goal or routine</text><text x="348" y="325" font-size="19" font-weight="400" fill="#b9cbd9">Check assumptions</text><text x="348" y="358" font-size="19" font-weight="400" fill="#b9cbd9">Revise after failure</text><text x="348" y="426" font-size="17" font-weight="400" fill="#87d2bc">Proposed model layer</text><path d="M591 310H606" fill="none" stroke="#e6ad61" stroke-width="2" marker-end="url(#arrow)"/><rect x="608" y="160" width="260" height="300" rx="12" fill="#1a2c3d" stroke="#385064"/><text x="628" y="200" font-size="21" font-weight="700" fill="#e6ad61">03</text><text x="628" y="247" font-size="27" font-weight="700" fill="#ffffff">EXECUTE</text><text x="628" y="292" font-size="19" font-weight="400" fill="#b9cbd9">Durable scripted work</text><text x="628" y="325" font-size="19" font-weight="400" fill="#b9cbd9">Bounded transfers</text><text x="628" y="358" font-size="19" font-weight="400" fill="#b9cbd9">Timeout and recovery</text><text x="628" y="426" font-size="17" font-weight="400" fill="#87d2bc">Existing foundation</text><path d="M871 310H886" fill="none" stroke="#e6ad61" stroke-width="2" marker-end="url(#arrow)"/><rect x="888" y="160" width="260" height="300" rx="12" fill="#1a2c3d" stroke="#385064"/><text x="908" y="200" font-size="21" font-weight="700" fill="#e6ad61">04</text><text x="908" y="247" font-size="27" font-weight="700" fill="#ffffff">VERIFY</text><text x="908" y="292" font-size="19" font-weight="400" fill="#b9cbd9">Inspect resulting state</text><text x="908" y="325" font-size="19" font-weight="400" fill="#b9cbd9">Record cost and outcome</text><text x="908" y="358" font-size="19" font-weight="400" fill="#b9cbd9">Score against the task</text><text x="908" y="426" font-size="17" font-weight="400" fill="#87d2bc">Tools + proposed scoring</text><path d="M1018 480V530H178V480" fill="none" stroke="#e6ad61" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="518" font-size="21" font-weight="400" fill="#e6ad61">Re-observe before repeating or revising</text><text x="52" y="606" font-size="24" font-weight="600" fill="#ffffff">Success is a verified change in the world, not an issued command.</text></g></svg>