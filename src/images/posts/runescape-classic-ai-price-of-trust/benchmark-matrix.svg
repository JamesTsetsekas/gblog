<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">A proposed benchmark ladder</title><desc id="desc">Five task families from skill progression to shared markets, with controlled starts, tools, budgets, versions, baselines and repeated trials.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#e6ad61" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#101c29"/><g font-family="Segoe UI,Arial,sans-serif"><text x="52" y="64" font-size="34" font-weight="700" fill="#ffffff">A PROPOSED BENCHMARK LADDER</text><text x="52" y="107" font-size="23" font-weight="400" fill="#8fb3c9">Different tasks expose different failure modes. No results are shown.</text><rect x="48" y="165" width="208" height="240" rx="12" fill="#1a2c3d" stroke="#385064"/><text x="65" y="210" font-size="21" font-weight="700" fill="#ffffff">SKILLS</text><text x="65" y="260" font-size="20" font-weight="400" fill="#b9cbd9">Equipment</text><text x="65" y="296" font-size="20" font-weight="400" fill="#b9cbd9">Supplies</text><text x="65" y="332" font-size="20" font-weight="400" fill="#b9cbd9">Progress</text><text x="65" y="381" font-size="15" font-weight="600" fill="#87d2bc">TASK FAMILY 1</text><rect x="272" y="165" width="208" height="240" rx="12" fill="#1a2c3d" stroke="#385064"/><text x="289" y="210" font-size="21" font-weight="700" fill="#ffffff">QUESTS</text><text x="289" y="260" font-size="20" font-weight="400" fill="#b9cbd9">Dependencies</text><text x="289" y="296" font-size="20" font-weight="400" fill="#b9cbd9">State retention</text><text x="289" y="332" font-size="20" font-weight="400" fill="#b9cbd9">Completion</text><text x="289" y="381" font-size="15" font-weight="600" fill="#87d2bc">TASK FAMILY 2</text><rect x="496" y="165" width="208" height="240" rx="12" fill="#1a2c3d" stroke="#385064"/><text x="513" y="210" font-size="21" font-weight="700" fill="#ffffff">PRODUCTION</text><text x="513" y="260" font-size="20" font-weight="400" fill="#b9cbd9">Inventories</text><text x="513" y="296" font-size="20" font-weight="400" fill="#b9cbd9">Bottlenecks</text><text x="513" y="332" font-size="20" font-weight="400" fill="#b9cbd9">Delivery</text><text x="513" y="381" font-size="15" font-weight="600" fill="#87d2bc">TASK FAMILY 3</text><rect x="720" y="165" width="208" height="240" rx="12" fill="#1a2c3d" stroke="#385064"/><text x="737" y="210" font-size="21" font-weight="700" fill="#ffffff">MULTI-AGENT</text><text x="737" y="260" font-size="20" font-weight="400" fill="#b9cbd9">Coordination</text><text x="737" y="296" font-size="20" font-weight="400" fill="#b9cbd9">Contention</text><text x="737" y="332" font-size="20" font-weight="400" fill="#b9cbd9">Recovery</text><text x="737" y="381" font-size="15" font-weight="600" fill="#87d2bc">TASK FAMILY 4</text><rect x="944" y="165" width="208" height="240" rx="12" fill="#1a2c3d" stroke="#385064"/><text x="961" y="210" font-size="21" font-weight="700" fill="#ffffff">MARKETS</text><text x="961" y="260" font-size="20" font-weight="400" fill="#b9cbd9">Valuation</text><text x="961" y="296" font-size="20" font-weight="400" fill="#b9cbd9">Settlement</text><text x="961" y="332" font-size="20" font-weight="400" fill="#b9cbd9">Trust</text><text x="961" y="381" font-size="15" font-weight="600" fill="#87d2bc">TASK FAMILY 5</text><rect x="48" y="446" width="1104" height="142" rx="12" fill="#15283a" stroke="#385064"/><text x="73" y="485" font-size="22" font-weight="700" fill="#e6ad61">SHARED EXPERIMENT CONTROLS</text><text x="73" y="528" font-size="24" font-weight="400" fill="#d9e3ed">Fixed starts · documented tools · matched budgets · pinned versions</text><text x="73" y="563" font-size="23" font-weight="400" fill="#d9e3ed">Scripted baselines · repeated trials · held-out tasks · cost and variation</text><text x="52" y="637" font-size="21" font-weight="400" fill="#8fb3c9">Measure peak and sustained progress separately. Retain the trajectory.</text></g></svg>