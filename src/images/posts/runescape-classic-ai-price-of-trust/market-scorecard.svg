<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">A proposed market scorecard</title><desc id="desc">Six separate dimensions for evaluating market agents: returns, execution, truthfulness, counterparties, market quality, and cooperation and power. No measured data.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#e6ad61" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#101c29"/><g font-family="Segoe UI,Arial,sans-serif"><text x="52" y="64" font-size="33" font-weight="700" fill="#ffffff">A MARKET SCORE NEEDS MORE THAN PROFIT</text><text x="52" y="106" font-size="22" font-weight="400" fill="#8fb3c9">Proposed dimensions · no measured results · valuations and rules must be explicit</text><rect x="48" y="150" width="352" height="194" rx="12" fill="#1a2c3d" stroke="#385064"/><text x="70" y="193" font-size="22" font-weight="700" fill="#e6ad61">RETURNS</text><text x="70" y="241" font-size="19" font-weight="400" fill="#b9cbd9">Net costs and liabilities</text><text x="70" y="275" font-size="19" font-weight="400" fill="#b9cbd9">Inventory and capital at risk</text><rect x="424" y="150" width="352" height="194" rx="12" fill="#1a2c3d" stroke="#385064"/><text x="446" y="193" font-size="22" font-weight="700" fill="#e6ad61">EXECUTION</text><text x="446" y="241" font-size="19" font-weight="400" fill="#b9cbd9">Fulfilled commitments</text><text x="446" y="275" font-size="19" font-weight="400" fill="#b9cbd9">Completed settlement</text><rect x="800" y="150" width="352" height="194" rx="12" fill="#1a2c3d" stroke="#385064"/><text x="822" y="193" font-size="22" font-weight="700" fill="#e6ad61">TRUTHFULNESS</text><text x="822" y="241" font-size="19" font-weight="400" fill="#b9cbd9">Claims against known facts</text><text x="822" y="275" font-size="19" font-weight="400" fill="#b9cbd9">Disclosed rules for omissions</text><rect x="48" y="368" width="352" height="194" rx="12" fill="#1a2c3d" stroke="#385064"/><text x="70" y="411" font-size="22" font-weight="700" fill="#e6ad61">COUNTERPARTIES</text><text x="70" y="459" font-size="19" font-weight="400" fill="#b9cbd9">Losses and returned mistakes</text><text x="70" y="493" font-size="19" font-weight="400" fill="#b9cbd9">Resilience to misleading claims</text><rect x="424" y="368" width="352" height="194" rx="12" fill="#1a2c3d" stroke="#385064"/><text x="446" y="411" font-size="22" font-weight="700" fill="#e6ad61">MARKET QUALITY</text><text x="446" y="459" font-size="19" font-weight="400" fill="#b9cbd9">Volume, spreads and fill rates</text><text x="446" y="493" font-size="19" font-weight="400" fill="#b9cbd9">Concentration and shock recovery</text><rect x="800" y="368" width="352" height="194" rx="12" fill="#1a2c3d" stroke="#385064"/><text x="822" y="411" font-size="22" font-weight="700" fill="#e6ad61">COOPERATION + POWER</text><text x="822" y="459" font-size="19" font-weight="400" fill="#b9cbd9">Productive specialization</text><text x="822" y="493" font-size="19" font-weight="400" fill="#b9cbd9">Evidence for collusion</text><text x="52" y="637" font-size="22" font-weight="600" fill="#ffffff">A high final balance can reflect production, luck, transfers, or default.</text></g></svg>